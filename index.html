<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Режимы просмотра · LH-Invest</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:"Segoe UI",sans-serif;color:#292433;background:#eeedf3}.bar{display:flex;align-items:center;gap:10px;padding:12px 20px;background:#fff;border-bottom:1px solid #dcd9e3;flex-wrap:wrap}.bar strong{margin-right:14px}.bar button,.bar a{font:inherit;padding:9px 14px;border:1px solid #ddd8e5;border-radius:8px;background:#f7f6fa;color:#352d46;cursor:pointer;text-decoration:none}.bar button[aria-pressed=true]{background:#59448b;color:white;border-color:#59448b}iframe{display:block;border:0;width:100%;height:calc(100vh - 66px);min-height:500px}@media(max-width:700px){iframe{height:calc(100vh - 130px)}}</style></head>
<body><nav class="bar" aria-label="Режимы просмотра"><strong>Режим просмотра</strong><button data-page="brand-review.html" aria-pressed="true">Конструктор</button><button data-page="presentation.html" aria-pressed="false">Показ и сравнение</button><button data-page="logo-mockup.html" aria-pressed="false">Продукт</button></nav>
<iframe src="brand-review.html" title="Просмотр логотипов"></iframe>
<script>const frame=document.querySelector('iframe');document.querySelectorAll('[data-page]').forEach(button=>button.addEventListener('click',()=>{frame.src=button.dataset.page;document.querySelectorAll('[data-page]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)))}));</script></body></html>
